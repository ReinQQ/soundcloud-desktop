name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SoundCloud Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## SoundCloud Desktop ${{ github.ref_name }}

            A lightweight, secure, native-feeling desktop client for SoundCloud built with Tauri v2.

            ### Features
            - Embedded SoundCloud with persistent login
            - Real-time Discord Rich Presence with "Listening to" status and live progress bar
            - Audio ad blocking between tracks & visual banner removal
            - Multi-protocol proxy support (HTTP, HTTPS, SOCKS4, SOCKS5) with authenticated relay
            - Frameless custom titlebar, system tray integration, and deep charcoal dark theme
            - Cryptographically signed auto-updates
          releaseDraft: false
          prerelease: false

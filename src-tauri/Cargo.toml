[package]
name = "app"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soundcloud-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
discord-rich-presence = "1.1.0"
url = "2.5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "cookies", "socks", "stream"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
regex = "1.10"
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "net", "io-util"] }
futures = "0.3"
tauri-plugin-single-instance = "2.5.5"

[profile.dev.package."*"]
opt-level = 2

